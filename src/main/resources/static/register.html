<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register</title>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
		rel="stylesheet">
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #0d0d0f;
			--surface: #161619;
			--border: #2a2a30;
			--accent: #c8a96e;
			--accent-dim: rgba(200, 169, 110, 0.12);
			--text: #e8e6e0;
			--muted: #6b6b70;
			--error: #e06c6c;
			--success: #52b788;
			--success-dim: rgba(82, 183, 136, 0.12);
		}

		body {
			font-family: 'DM Sans', sans-serif;
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		body::before,
		body::after {
			content: '';
			position: fixed;
			border-radius: 50%;
			filter: blur(80px);
			pointer-events: none;
			z-index: 0;
		}

		body::before {
			width: 500px;
			height: 500px;
			background: radial-gradient(circle, rgba(200, 169, 110, 0.08) 0%, transparent 70%);
			top: -100px;
			right: -100px;
			animation: drift 12s ease-in-out infinite alternate;
		}

		body::after {
			width: 400px;
			height: 400px;
			background: radial-gradient(circle, rgba(82, 183, 136, 0.05) 0%, transparent 70%);
			bottom: -80px;
			left: -80px;
			animation: drift 15s ease-in-out infinite alternate-reverse;
		}

		@keyframes drift {
			from {
				transform: translate(0, 0);
			}

			to {
				transform: translate(40px, 30px);
			}
		}

		.card {
			position: relative;
			z-index: 1;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 20px;
			width: 420px;
			padding: 48px 40px;
			animation: fadeUp 0.6s ease both;
			box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
		}

		@keyframes fadeUp {
			from {
				opacity: 0;
				transform: translateY(24px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.logo {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 36px;
		}

		.logo-icon {
			width: 36px;
			height: 36px;
			background: var(--accent);
			border-radius: 10px;
			display: grid;
			place-items: center;
			font-size: 16px;
		}

		.logo-text {
			font-family: 'DM Serif Display', serif;
			font-size: 20px;
			letter-spacing: -0.5px;
			color: var(--text);
		}

		h1 {
			font-family: 'DM Serif Display', serif;
			font-size: 28px;
			font-weight: 400;
			line-height: 1.2;
			margin-bottom: 6px;
		}

		h1 em {
			color: var(--accent);
			font-style: italic;
		}

		.subtitle {
			color: var(--muted);
			font-size: 14px;
			margin-bottom: 32px;
			font-weight: 300;
		}

		.field {
			margin-bottom: 18px;
		}

		label {
			display: block;
			font-size: 12px;
			font-weight: 500;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 8px;
		}

		input {
			width: 100%;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 13px 16px;
			color: var(--text);
			font-family: 'DM Sans', sans-serif;
			font-size: 15px;
			transition: border-color 0.2s, box-shadow 0.2s;
			outline: none;
		}

		input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-dim);
		}

		input::placeholder {
			color: var(--muted);
		}

		.btn {
			width: 100%;
			padding: 14px;
			background: var(--accent);
			color: #0d0d0f;
			border: none;
			border-radius: 10px;
			font-family: 'DM Sans', sans-serif;
			font-size: 15px;
			font-weight: 500;
			cursor: pointer;
			transition: opacity 0.2s, transform 0.15s;
			margin-top: 8px;
			position: relative;
			overflow: hidden;
		}

		.btn:hover {
			opacity: 0.9;
			transform: translateY(-1px);
		}

		.btn:active {
			transform: translateY(0);
		}

		.btn:disabled {
			opacity: 0.6;
			cursor: not-allowed;
			transform: none;
		}

		.btn .spinner {
			display: none;
			width: 16px;
			height: 16px;
			border: 2px solid rgba(0, 0, 0, 0.3);
			border-top-color: #0d0d0f;
			border-radius: 50%;
			animation: spin 0.7s linear infinite;
			margin: 0 auto;
		}

		.btn.loading .btn-text {
			display: none;
		}

		.btn.loading .spinner {
			display: block;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		.error-msg {
			background: rgba(224, 108, 108, 0.1);
			border: 1px solid rgba(224, 108, 108, 0.25);
			border-radius: 8px;
			padding: 10px 14px;
			font-size: 13px;
			color: var(--error);
			margin-top: 16px;
			display: none;
		}

		.error-msg.show {
			display: block;
		}

		.success-msg {
			background: var(--success-dim);
			border: 1px solid rgba(82, 183, 136, 0.25);
			border-radius: 8px;
			padding: 10px 14px;
			font-size: 13px;
			color: var(--success);
			margin-top: 16px;
			display: none;
			text-align: center;
		}

		.success-msg.show {
			display: block;
		}

		.footer-link {
			text-align: center;
			margin-top: 24px;
			font-size: 13px;
			color: var(--muted);
		}

		.footer-link a {
			color: var(--accent);
			text-decoration: none;
			font-weight: 500;
		}

		.footer-link a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="logo">
			<div class="logo-icon">✦</div>
			<span class="logo-text">Karim</span>
		</div>

		<h1>Create an <em>account</em></h1>
		<p class="subtitle">Join us and start shopping today</p>

		<div class="field">
			<label>Full Name</label>
			<input type="text" id="name" placeholder="Enter your full name" />
		</div>

		<div class="field">
			<label>Email</label>
			<input type="email" id="email" placeholder="Enter your email" />
		</div>

		<div class="field">
			<label>Password</label>
			<input type="password" id="password" placeholder="Create a password" />
		</div>

		<div class="field">
			<label>Confirm Password</label>
			<input type="password" id="confirmPassword" placeholder="Repeat your password" />
		</div>

		<div class="field">

		</div>

		<button class="btn" id="registerBtn" onclick="handleRegister()">
			<span class="btn-text">Create Account</span>
			<div class="spinner"></div>
		</button>

		<div class="error-msg" id="errorMsg"></div>
		<div class="success-msg" id="successMsg"></div>

		<p class="footer-link">Already have an account? <a href="login.html">Sign in</a></p>
	</div>

	<script>
		async function handleRegister() {
			const name = document.getElementById('name').value.trim();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			const confirmPassword = document.getElementById('confirmPassword').value;
			const btn = document.getElementById('registerBtn');

			document.getElementById('errorMsg').classList.remove('show');
			document.getElementById('successMsg').classList.remove('show');

			// ── Client-side validation ───────────────────────────────────────────────
			if (!name || !email || !password || !confirmPassword) {
				showError('Please fill in all fields.'); return;
			}
			if (password.length < 6) {
				showError('Password must be at least 6 characters.'); return;
			}
			if (password !== confirmPassword) {
				showError('Passwords do not match.'); return;
			}

			btn.classList.add('loading');
			btn.disabled = true;

			try {
				const res = await fetch('/api/auth/register', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify({
						name,
						email,
						password,
						role: 'USER'
					})
				});

				const rawText = await res.text();

				if (!res.ok) {
					let msg = `Server returned ${res.status}`;
					try {
						const err = JSON.parse(rawText);
						msg = err.message || err.error || JSON.stringify(err);
					} catch {
						if (rawText) msg = rawText;
					}
					throw new Error(msg);
				}

				// ── Success ─────────────────────────────────────────────────────────────
				const successEl = document.getElementById('successMsg');
				successEl.textContent = '✓ Account created! Redirecting to login…';
				successEl.classList.add('show');

				// Redirect to login after 1.5s
				setTimeout(() => {
					window.location.href = 'login.html';
				}, 1500);

			} catch (err) {
				showError(err.message || 'Registration failed. Please try again.');
			} finally {
				btn.classList.remove('loading');
				btn.disabled = false;
			}
		}

		function showError(msg) {
			const el = document.getElementById('errorMsg');
			el.textContent = msg;
			el.classList.add('show');
		}

		// Allow Enter key
		document.addEventListener('keydown', e => {
			if (e.key === 'Enter') handleRegister();
		});
	</script>
</body>

</html>
