<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f5f0; --surface: #ffffff; --border: #e8e4dc;
    --accent: #2d6a4f; --accent-light: rgba(45,106,79,0.08);
    --text: #1a1a1a; --muted: #888; --red: #e06c6c; --red-dim: rgba(224,108,108,0.1);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 20px rgba(0,0,0,0.04); }
  .nav-logo { font-family: 'DM Serif Display', serif; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  .nav-logo span { width:30px;height:30px;background:var(--accent);border-radius:8px;display:grid;place-items:center;color:white;font-size:14px; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .back-btn, .logout-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .logout-btn:hover { border-color: #ccc; color: var(--text); }
  .page { max-width: 1100px; margin: 0 auto; padding: 48px 40px 80px; display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 36px; font-weight: 400; margin-bottom: 6px; }
  .page-title em { font-style: italic; color: var(--accent); }
  .page-sub { color: var(--muted); font-size: 14px; font-weight: 300; margin-bottom: 28px; }
  .cart-list { display: flex; flex-direction: column; gap: 14px; }
  .cart-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 20px; animation: fadeUp 0.4s ease both; transition: box-shadow 0.2s; }
  .cart-item:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .item-icon { width:64px;height:64px;background:linear-gradient(135deg,#d8f3dc,#b7e4c7);border-radius:12px;display:grid;place-items:center;font-size:28px;flex-shrink:0; }
  .item-info { flex: 1; }
  .item-name { font-family: 'DM Serif Display', serif; font-size: 17px; margin-bottom: 4px; }
  .item-id { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .item-unit-price { font-size: 13px; color: var(--muted); }
  .item-unit-price strong { color: var(--text); }
  .qty-control { display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0; }
  .qty-btn { width:34px;height:34px;background:var(--bg);border:none;font-size:16px;cursor:pointer;color:var(--text);transition:background 0.15s;display:grid;place-items:center;user-select:none; }
  .qty-btn:hover:not(:disabled):not(.loading) { background: var(--border); }
  .qty-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .qty-btn.loading { opacity: 0.45; cursor: wait; pointer-events: none; }
  .qty-val { width:40px;text-align:center;font-size:14px;font-weight:600;border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:34px;background:white; }
  .item-total { font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;min-width:90px;text-align:right;flex-shrink:0; }
  .remove-btn { background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;transition:all 0.15s;flex-shrink:0; }
  .remove-btn:hover { background:var(--red-dim);color:var(--red); }
  .summary-card { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;position:sticky;top:84px;animation:fadeUp 0.4s ease 0.1s both; }
  .summary-title { font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:20px; }
  .summary-row { display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:var(--muted); }
  .summary-row strong { color:var(--text); }
  .summary-divider { border:none;border-top:1px solid var(--border);margin:16px 0; }
  .summary-total { display:flex;justify-content:space-between;font-size:18px;font-weight:600;margin-bottom:20px; }
  .summary-total span:last-child { font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent); }
  .shipping-hint { font-size:12px;color:var(--accent);margin-bottom:8px;background:var(--accent-light);padding:8px 12px;border-radius:8px; }
  .checkout-btn { width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity 0.2s,transform 0.15s; }
  .checkout-btn:hover { opacity:.88;transform:translateY(-1px); }
  .checkout-btn:disabled { opacity:.55;cursor:not-allowed;transform:none; }
  .clear-btn { width:100%;padding:11px;background:none;color:var(--red);border:1px solid rgba(224,108,108,.35);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;margin-top:10px;transition:all 0.2s; }
  .clear-btn:hover { background:var(--red-dim);border-color:var(--red); }
  .clear-btn:disabled { opacity:.5;cursor:not-allowed; }
  .summary-note { font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5; }
  .empty-state { grid-column:1/-1;text-align:center;padding:80px 40px;background:var(--surface);border:1px solid var(--border);border-radius:16px;animation:fadeUp 0.4s ease both; }
  .empty-icon { font-size:56px;margin-bottom:16px; }
  .empty-title { font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:8px; }
  .empty-sub { color:var(--muted);font-size:14px;margin-bottom:24px; }
  .shop-btn { padding:11px 28px;background:var(--accent);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.2s; }
  .shop-btn:hover { opacity:.88; }
  .error-state { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px;text-align:center;color:var(--red); }
  .skeleton { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;display:flex;align-items:center;gap:20px; }
  .skel-box { border-radius:8px;background:#e8e4dc;animation:pulse 1.4s ease infinite alternate;flex-shrink:0; }
  @keyframes pulse { from{opacity:1} to{opacity:0.4} }
  .toast { position:fixed;bottom:28px;right:28px;background:var(--text);color:white;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transform:translateY(12px);transition:all 0.3s;pointer-events:none;z-index:999; }
  .toast.show { opacity:1;transform:translateY(0); }
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><span>✦</span> Karim</div>
  <div class="nav-right">
    <button class="back-btn" onclick="window.location.href='products.html'">← Continue Shopping</button>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</nav>
<div class="page" id="pageContent"></div>
<div class="toast" id="toast"></div>
<script>
  const token = localStorage.getItem('authToken');
  if (!token) window.location.href = 'login.html';

  let cartItems = [];
  const pendingUpdates = new Set();

  function guessEmoji(name) {
    if (!name) return '📦';
    const n = name.toLowerCase();
    if (n.includes('phone') || n.includes('mobile'))  return '📱';
    if (n.includes('laptop') || n.includes('comput')) return '💻';
    if (n.includes('head') || n.includes('earphone')) return '🎧';
    if (n.includes('watch'))                           return '⌚';
    if (n.includes('speaker'))                         return '🔊';
    if (n.includes('shirt') || n.includes('cloth'))   return '👔';
    if (n.includes('shoe') || n.includes('sneak'))    return '👟';
    if (n.includes('wallet') || n.includes('bag'))    return '👜';
    if (n.includes('lamp') || n.includes('light'))    return '🪔';
    if (n.includes('coffee') || n.includes('maker'))  return '☕';
    return '📦';
  }

  function fmt(val) {
    return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2 });
  }

  function showSkeleton() {
    document.getElementById('pageContent').innerHTML = `
      <div>
        <div style="margin-bottom:28px">
          <div style="height:36px;width:200px;background:#e8e4dc;border-radius:8px;margin-bottom:8px;animation:pulse 1.4s ease infinite alternate"></div>
          <div style="height:14px;width:140px;background:#e8e4dc;border-radius:6px;animation:pulse 1.4s ease infinite alternate"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          ${[1,2,3].map(() => `
            <div class="skeleton">
              <div class="skel-box" style="width:64px;height:64px;border-radius:12px"></div>
              <div style="flex:1">
                <div class="skel-box" style="height:16px;width:55%;margin-bottom:8px"></div>
                <div class="skel-box" style="height:12px;width:35%"></div>
              </div>
              <div class="skel-box" style="width:80px;height:34px;border-radius:8px"></div>
              <div class="skel-box" style="width:70px;height:22px;border-radius:4px"></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="summary-card">
        <div class="skel-box" style="height:20px;width:120px;margin-bottom:24px"></div>
        ${[1,2,3].map(() => `<div class="skel-box" style="height:14px;width:100%;margin-bottom:12px"></div>`).join('')}
        <div class="skel-box" style="height:48px;width:100%;border-radius:10px;margin-top:20px"></div>
      </div>`;
  }

  async function loadCart() {
    showSkeleton();
    try {
      const res = await fetch('http://localhost:9090/api/cart', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
      if (!res.ok) throw new Error('Server returned ' + res.status);
      cartItems = await res.json();
      renderCart();
    } catch (err) {
      document.getElementById('pageContent').innerHTML = `
        <div class="error-state" style="grid-column:1/-1">
          <div style="font-size:36px;margin-bottom:12px">⚠️</div>
          <div style="font-size:15px;margin-bottom:8px">Failed to load cart</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:20px">${err.message}</div>
          <button onclick="loadCart()" class="shop-btn">Retry</button>
        </div>`;
    }
  }

  function renderCart() {
    const page = document.getElementById('pageContent');
    if (!cartItems || cartItems.length === 0) {
      page.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🛒</div>
          <div class="empty-title">Your cart is empty</div>
          <div class="empty-sub">Add some products and they'll show up here</div>
          <button class="shop-btn" onclick="window.location.href='products.html'">Browse Products</button>
        </div>`;
      return;
    }
    page.innerHTML = `
      <div>
        <h1 class="page-title">My <em>Cart</em></h1>
        <p class="page-sub" id="itemCountLabel"></p>
        <div class="cart-list">
          ${cartItems.map((item, idx) => itemHTML(item, idx)).join('')}
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-title">Order Summary</div>
        <div id="summaryBody"></div>
        <button class="checkout-btn" id="checkoutBtn" onclick="proceedToCheckout()">Proceed to Checkout →</button>
        <button class="clear-btn" id="clearCartBtn" onclick="clearCart()">🧹 Clear Cart</button>
        <p class="summary-note">🔒 Secure checkout &nbsp;·&nbsp; Free returns within 7 days</p>
      </div>`;
    refreshSummary();
  }

  function itemHTML(item, idx) {
    return `
      <div class="cart-item" id="item-${item.cartItemId}" style="animation-delay:${idx*0.07}s">
        <div class="item-icon">${guessEmoji(item.productName)}</div>
        <div class="item-info">
          <div class="item-name">${item.productName}</div>
          <div class="item-id">Product ID: ${item.productId}</div>
          <div class="item-unit-price">Unit price: <strong>${fmt(item.price)}</strong></div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" id="btn-minus-${item.cartItemId}"
            onclick="changeQty(${item.cartItemId}, -1)"
            ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
          <div class="qty-val" id="qty-${item.cartItemId}">${item.quantity}</div>
          <button class="qty-btn" id="btn-plus-${item.cartItemId}"
            onclick="changeQty(${item.cartItemId}, +1)">+</button>
        </div>
        <div class="item-total" id="total-${item.cartItemId}">${fmt(item.totalPrice)}</div>
        <button class="remove-btn" onclick="removeItem(${item.cartItemId})" title="Remove">🗑</button>
      </div>`;
  }

  function refreshSummary() {
    const subtotal  = cartItems.reduce((s, i) => s + i.totalPrice, 0);
    const itemCount = cartItems.reduce((s, i) => s + i.quantity,   0);
    const shipping  = subtotal > 999 ? 0 : 49;
    const grand     = subtotal + shipping;
    const label = document.getElementById('itemCountLabel');
    if (label) label.textContent = `${itemCount} item${itemCount !== 1 ? 's' : ''} in your cart`;
    const body = document.getElementById('summaryBody');
    if (!body) return;
    body.innerHTML = `
      <div class="summary-row">
        <span>Subtotal (${itemCount} item${itemCount !== 1 ? 's' : ''})</span>
        <strong>${fmt(subtotal)}</strong>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <strong>${shipping === 0 ? '<span style="color:var(--accent)">FREE</span>' : '₹' + shipping}</strong>
      </div>
      <div class="shipping-hint">
        ${shipping > 0
          ? `🎉 Add ₹${(999 - subtotal + 0.01).toFixed(0)} more for free shipping!`
          : `✓ You've unlocked free shipping!`}
      </div>
      <hr class="summary-divider">
      <div class="summary-total">
        <span>Total</span>
        <span>${fmt(grand)}</span>
      </div>`;
  }

  async function changeQty(cartItemId, delta) {
    if (pendingUpdates.has(cartItemId)) return;
    const item = cartItems.find(i => i.cartItemId === cartItemId);
    if (!item) return;
    const newQty = item.quantity + delta;
    if (newQty < 1) return;
    pendingUpdates.add(cartItemId);
    setBtnsState(cartItemId, true);
    item.quantity   = newQty;
    item.totalPrice = item.price * newQty;
    document.getElementById('qty-'   + cartItemId).textContent = newQty;
    document.getElementById('total-' + cartItemId).textContent = fmt(item.totalPrice);
    refreshSummary();
    try {
      const res = await fetch('http://localhost:9090/api/cart/update', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ cartItemId, quantity: newQty })
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
      if (!res.ok) throw new Error('Update failed');
      const updated = await res.json();
      item.quantity   = updated.quantity;
      item.totalPrice = updated.totalPrice;
      document.getElementById('qty-'   + cartItemId).textContent = updated.quantity;
      document.getElementById('total-' + cartItemId).textContent = fmt(updated.totalPrice);
      refreshSummary();
    } catch (err) {
      const prev = item.quantity - delta;
      item.quantity   = prev;
      item.totalPrice = item.price * prev;
      document.getElementById('qty-'   + cartItemId).textContent = prev;
      document.getElementById('total-' + cartItemId).textContent = fmt(item.totalPrice);
      refreshSummary();
      showToast('❌ Could not update quantity', true);
    } finally {
      pendingUpdates.delete(cartItemId);
      setBtnsState(cartItemId, false);
    }
  }

  function setBtnsState(cartItemId, loading) {
    const minus = document.getElementById('btn-minus-' + cartItemId);
    const plus  = document.getElementById('btn-plus-'  + cartItemId);
    if (!minus || !plus) return;
    if (loading) {
      minus.classList.add('loading');
      plus.classList.add('loading');
    } else {
      minus.classList.remove('loading');
      plus.classList.remove('loading');
      const item = cartItems.find(i => i.cartItemId === cartItemId);
      minus.disabled = item ? item.quantity <= 1 : false;
    }
  }

  async function removeItem(cartItemId) {
    const el = document.getElementById('item-' + cartItemId);
    el.style.transition = 'opacity 0.3s, transform 0.3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    try {
      const res = await fetch(`http://localhost:9090/api/cart/remove/${cartItemId}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
      if (!res.ok) throw new Error('Remove failed');
      setTimeout(() => {
        cartItems = cartItems.filter(i => i.cartItemId !== cartItemId);
        renderCart();
        showToast('🗑 Item removed from cart');
      }, 300);
    } catch (err) {
      el.style.opacity = '1';
      el.style.transform = 'translateX(0)';
      showToast('❌ Could not remove item', true);
    }
  }

  async function clearCart() {
    if (!confirm('Are you sure you want to clear your entire cart?')) return;
    const clearBtn = document.getElementById('clearCartBtn');
    if (clearBtn) { clearBtn.disabled = true; clearBtn.textContent = 'Clearing...'; }
    try {
      const res = await fetch('http://localhost:9090/api/cart/clear', {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
      if (!res.ok) throw new Error('Clear failed');
      cartItems = [];
      renderCart();
      showToast('🧹 Cart cleared successfully');
    } catch (err) {
      if (clearBtn) { clearBtn.disabled = false; clearBtn.textContent = '🧹 Clear Cart'; }
      showToast('❌ Could not clear cart', true);
    }
  }

  // ── Proceed to checkout — just saves summary & goes to payment page ─────────
  // The actual POST /api/order/checkout is called from payment.html when
  // the user clicks "Send OTP", so we only need to pass the summary data here.
  async function proceedToCheckout() {
    if (cartItems.length === 0) { showToast('❌ Your cart is empty', true); return; }

    const btn = document.getElementById('checkoutBtn');
    btn.disabled = true;
    btn.textContent = 'Loading...';

    const subtotal = cartItems.reduce((s, i) => s + i.totalPrice, 0);
    const shipping = subtotal > 999 ? 0 : 49;

    localStorage.setItem('checkoutSummary', JSON.stringify({
      subtotal,
      shipping,
      grand: subtotal + shipping,
      itemCount: cartItems.reduce((s, i) => s + i.quantity, 0)
    }));

    window.location.href = 'payment.html';
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e06c6c' : '#1a1a1a';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function logout() { localStorage.clear(); window.location.href = 'login.html'; }

  loadCart();
</script>
</body>
</html>
