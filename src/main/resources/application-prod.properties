spring.application.name=auth_service

# ----------------- MySQL / Aiven -----------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ----------------- JWT -----------------
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ----------------- Brevo API -----------------
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Karim Mart

# Server Port (Optional)
server.port=${PORT:9090}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.core.env=DEBUG


# Cloudinary properties

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


app.base-url=https://super-market-application.onrender.com

#grok properties
groq.api.key=${GROQ.API.KEY}
groq.api.url=${GROQ.API.URL}
groq.model=${GROQ.MODEL}
